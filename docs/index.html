<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verified - Animal Birthday Predictor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0A192F;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #112240;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 16px;
      padding: 44px 36px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }
    .icon-container {
      width: 84px;
      height: 84px;
      margin: 0 auto 24px auto;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(214, 178, 63, 0.2), rgba(237, 208, 134, 0.1));
      border: 2px solid #D4AF37;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .icon-container svg {
      width: 44px;
      height: 44px;
      stroke: #D4AF37;
    }
    h1 {
      color: #D4AF37;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }
    p {
      color: #8A8F98;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 8px 18px;
      background-color: #131B2D;
      border: 1px solid #080E1A;
      border-radius: 20px;
      color: #525358;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
      </svg>
    </div>
    <h1>Email Verified Successfully</h1>
    <p>Your email address has been successfully verified. You may now return to the <strong>Animal Birthday Predictor</strong> application to log in to your account.</p>
    <div class="badge">Animal Birthday Predictor &bull; Secure Auth</div>
  </div>
</body>
</html>
